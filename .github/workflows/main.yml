name: Saucedemo UI Autotests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Set up Python 3.11
        uses: actions/setup-python@v5.3.0
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ensure Playwright browsers are installed
        run: playwright install chromium --with-deps

      - name: Create credentials.json from GitHub Secrets
        run: |
          mkdir -p data
          echo '${{ secrets.CREDENTIALS_JSON }}' > data/credentials.json

      - name: Run Pytest UI Tests
        run: pytest
        continue-on-error: true

      # Шаг 1: Нативная и быстрая установка Allure CLI напрямую в Ubuntu
      - name: Install Allure CLI
        if: always()
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jre-headless
          wget https://github.com
          sudo dpkg -i allure_2.24.1-1_all.deb

      # Шаг 2: Безопасное скачивание истории прошлых тестов
      - name: Load Allure history
        uses: actions/checkout@v4.2.2
        if: always()
        with:
          ref: gh-pages
          path: gh-pages-dir
        continue-on-error: true

      # Шаг 3: Перенос старой истории и нативная сборка нового отчета
      - name: Build Allure Report
        if: always()
        run: |
          mkdir -p allure-history
          if [ -d "gh-pages-dir/history" ]; then
            cp -r gh-pages-dir/history allure-results/ || true
          fi
          allure generate allure-results -o allure-history --clean

      # Шаг 4: Деплой готовой статики в GitHub Pages
      - name: Deploy Allure Report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4.0.0
        if: always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history
