name: Saucedemo UI Autotests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  test:
    # Фиксируем стабильную версию Ubuntu, чтобы избежать предупреждений системы
    runs-on: ubuntu-24.04

    steps:
      # Используем обновленную версию экшена checkout
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ensure Playwright browsers are installed
        run: playwright install chromium --with-deps

      - name: Create credentials.json from GitHub Secrets
        run: |
          mkdir -p data
          echo '${{ secrets.CREDENTIALS_JSON }}' > data/credentials.json

      - name: Run Pytest UI Tests
        run: pytest
        # Если тесты упадут, мы всё равно продолжим, чтобы сгенерировать отчет со скриншотами
        continue-on-error: true

      # Устанавливаем Allure CLI напрямую в систему (это быстрее и надежнее Docker-контейнеров)
      - name: Install Allure CLI
        if: always()
        run: |
          sudo apt-get update && sudo apt-get install -y openjdk-17-jre-headless
          wget https://github.com
          sudo dpkg -i allure_2.24.1-1_all.deb

      # Безопасный выкач истории: если ветки gh-pages нет, шаг просто создаст пустую папку
      - name: Load Allure history
        uses: actions/checkout@v4.2.2
        if: always()
        with:
          ref: gh-pages
          path: gh-pages-dir
        continue-on-error: true

      # Копируем старую историю в результаты (если она есть) и собираем новый отчет
      - name: Build Allure Report
        if: always()
        run: |
          mkdir -p allure-history
          if [ -d "gh-pages-dir/history" ]; then
            cp -r gh-pages-dir/history allure-results/
          fi
          allure generate allure-results -o allure-history --clean

      # Публикуем отчет в GitHub Pages
      - name: Deploy Allure Report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        if: always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history
