name: Saucedemo UI Autotests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ensure Playwright browsers are installed
        run: playwright install chromium --with-deps

      - name: Create credentials.json from GitHub Secrets
        run: |
          mkdir -p data
          echo '${{ secrets.CREDENTIALS_JSON }}' > data/credentials.json

      - name: Run Pytest UI Tests
        run: pytest
        continue-on-error: true # Если тесты упадут, мы всё равно соберем отчет

      - name: Load Allure history
        uses: actions/checkout@v4
        if: always()
        with:
          ref: gh-pages
          path: gh-pages
        continue-on-error: true # Если ветки gh-pages еще нет, шаг не заблокирует сборку

      - name: Build Allure Report
        uses: simple-elf/allure-report-action@v1.11
        if: always()
        with:
          allure_results: allure-results
          allure_history: allure-history
          keep_reports: 20

      - name: Deploy Allure Report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        if: always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history
