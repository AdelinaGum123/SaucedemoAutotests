name: Saucedemo UI Autotests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ensure Playwright browsers are installed
        run: playwright install chromium --with-deps

      - name: Create credentials.json from GitHub Secrets
        env:
          CREDS: ${{ secrets.CREDENTIALS_JSON }}
        run: |
          mkdir -p data
          printf '%s' "$CREDS" > data/credentials.json

      - name: Run Pytest UI Tests
        run: pytest --alluredir=allure-results
        continue-on-error: true

      # Забираем историю прошлых запусков из ветки gh-pages (если она уже есть)
      - name: Load Allure history
        uses: actions/checkout@v5
        if: always()
        with:
          ref: gh-pages
          path: gh-pages-dir
        continue-on-error: true

      - name: Move Allure history
        if: always()
        run: |
          mkdir -p allure-results
          if [ -d "gh-pages-dir/history" ]; then
            cp -r gh-pages-dir/history allure-results/history
          fi

      # Allure CLI ставим напрямую (Java уже есть на ubuntu-24.04), без Docker
      - name: Install Allure CLI
        if: always()
        run: npm install -g allure-commandline

      - name: Build Allure Report
        if: always()
        run: allure generate allure-results --clean -o allure-report

      - name: Deploy Allure Report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4.0.0
        if: always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-report