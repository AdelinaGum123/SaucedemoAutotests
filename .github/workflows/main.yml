name: Saucedemo UI Autotests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      # Исправлено: отключен встроенный кэш Python, вызывающий ошибку 400
      - name: Set up Python 3.11
        uses: actions/setup-python@v5.3.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ensure Playwright browsers are installed
        run: playwright install chromium --with-deps

      - name: Create credentials.json from GitHub Secrets
        run: |
          mkdir -p data
          echo '${{ secrets.CREDENTIALS_JSON }}' > data/credentials.json

      - name: Run Pytest UI Tests
        run: pytest
        continue-on-error: true

      # Безопасный выкач истории прошлых тестов
      - name: Load Allure history
        uses: actions/checkout@v4.2.2
        if: always()
        with:
          ref: gh-pages
          path: gh-pages-dir
        continue-on-error: true

      # Перенос старой истории (если есть) в результаты
      - name: Move Allure history
        if: always()
        run: |
          if [ -d "gh-pages-dir/history" ]; then
            mkdir -p allure-results
            cp -r gh-pages-dir/history allure-results/
          fi

      # Корректная сборка отчета через официальный экшен (без Docker)
      - name: Build Allure Report
        uses: simple-elf/allure-report-action@v1.12
        if: always()
        with:
          allure_results: allure-results
          allure_history: allure-history
          keep_reports: 20

      # Публикация готового отчета в GitHub Pages
      - name: Deploy Allure Report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4.0.0
        if: always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history
