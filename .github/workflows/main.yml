name: Saucedemo UI Autotests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ensure Playwright browsers are installed
        run: playwright install chromium --with-deps

      - name: Create credentials.json from GitHub Secrets
        run: |
          mkdir -p data
          echo '${{ secrets.CREDENTIALS_JSON }}' > data/credentials.json

      - name: Run Pytest UI Tests
        run: pytest
        continue-on-error: true # Если тесты упадут, мы всё равно соберем отчет

      - name: Load Allure history
        run: |
          git fetch origin
          if git show-ref --verify --quiet refs/remotes/origin/gh-pages; then
            git clone --branch gh-pages --single-branch https://github.com{{ github.repository }}.git gh-pages
            mkdir -p allure-history
            cp -r gh-pages/* allure-history/ || true
          else
            echo "Ветка gh-pages еще не существует. Это первый запуск. Создаем пустую историю."
            mkdir -p allure-history
          fi
        continue-on-error: true


      - name: Build Allure Report
        uses: simple-elf/allure-report-action@v1.11
        if: always()
        with:
          allure_results: allure-results
          allure_history: allure-history
          keep_reports: 20

      - name: Deploy Allure Report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        if: always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history
